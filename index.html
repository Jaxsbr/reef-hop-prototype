<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Reef Hop — a little ocean adventure</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #000; color: #edffff; font-family: system-ui, sans-serif; text-align: center; }
    main {
      width: 100%; height: 100vh; height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 16px; padding: 4px 8px; }
    h1 { margin: 0; font-size: clamp(18px, 3vw, 28px); white-space: nowrap; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    button {
      font: 700 clamp(14px, 2vw, 19px) system-ui; min-height: 44px;
      border: 0; border-radius: 12px; background: #b9f5ec; color: #08394d;
      padding: 8px 12px; cursor: pointer; touch-action: manipulation;
    }
    [aria-pressed="true"] { box-shadow: inset 0 0 0 3px #ffc56b; }
    button:active { transform: scale(.95); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
    #game { min-width: 0; min-height: 0; overflow: hidden; background: #000; }
    /* Phaser FIT owns both canvas dimensions and centering margins. */
    canvas { display: block; }
    .controls { padding: 4px 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🐠 Reef Hop</h1>
      <nav aria-label="Choose your fish">
        <button data-fish="orange" aria-pressed="true">🟠 Sunny</button>
        <button data-fish="blue" aria-pressed="false">🔵 Blue</button>
        <button data-fish="pink" aria-pressed="false">🩷 Rosie</button>
        <button data-fish="green" aria-pressed="false">🟢 Kiwi</button>
      </nav>
    </header>
    <div id="game" aria-label="Four lane underwater obstacle game"></div>
    <nav class="controls" aria-label="Game controls">
      <button id="up" aria-label="Move up one lane">↑ Up</button>
      <button id="down" aria-label="Move down one lane">↓ Down</button>
      <button id="restart">↻ Restart</button>
    </nav>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
